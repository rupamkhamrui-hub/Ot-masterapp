name: Build Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Sign Release APK
        run: |
          mkdir -p www
          cp index.html www/
          npm install
          npx cap init "OT MasterPrep" "com.otmasterprep.app" --web-dir www
          npx cap add android
          keytool -genkey -v -keystore release.keystore -alias otmaster -keyalg RSA -keysize 2048 -validity 10000 -storepass otmaster123 -keypass otmaster123 -dname "CN=OTMasterPrep, OU=Education, O=OTPrep, L=Kolkata, ST=WB, C=IN"
          cd android/app
          cp ../../release.keystore .
          cat << 'EOF' >> build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'otmaster123'
                      keyAlias 'otmaster'
                      keyPassword 'otmaster123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          cd ..
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OT-MasterPrep-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
